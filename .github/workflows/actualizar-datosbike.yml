
name: Probar conexion OneDrive DatosBike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-descarga:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Excel de OneDrive
        env:
          ONEDRIVE_URL: "https://1drv.ms/x/c/143c0709754a4f31/IQDSFwhkU7J1QrM_ylaHg4d6ATX0jRFfdGMDFm8gt49m1IM?e=Cqyp9I"

        run: |
          echo "Iniciando descarga de DatosBike..."

          curl -fLsS \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 120 \
            -A "Mozilla/5.0" \
            "$ONEDRIVE_URL" \
            -o datosbike-descarga

          echo "Tamano descargado:"
          wc -c datosbike-descarga

          echo "Tipo de archivo:"
          file datosbike-descarga

          echo "Validando archivo Excel..."

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          archivo = Path("datosbike-descarga")

          if not archivo.exists():
              raise SystemExit("ERROR: No se descargo el archivo.")

          if archivo.stat().st_size == 0:
              raise SystemExit("ERROR: Archivo vacio.")

          try:
              with ZipFile(archivo) as z:
                  nombres = set(z.namelist())

                  if "[Content_Types].xml" not in nombres:
                      raise ValueError("No es un XLSX valido.")

                  if "xl/workbook.xml" not in nombres:
                      raise ValueError("No contiene un libro Excel.")

          except (BadZipFile, ValueError) as e:
              raise SystemExit(
                  f"ERROR: OneDrive no entrego un XLSX valido: {e}"
              )

          print("EXITO: Archivo Excel descargado y validado.")
          PY
